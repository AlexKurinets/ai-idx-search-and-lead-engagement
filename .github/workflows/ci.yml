name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: api (NestJS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: idx
          POSTGRES_PASSWORD: idx
          POSTGRES_DB: idx
        ports: ["5442:5432"]
        options: >-
          --health-cmd "pg_isready -U idx -d idx"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 40
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Integration tests (PostGIS, row-level security)
        run: npm run test:int

  ai:
    name: ai (FastAPI + Temporal)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ai/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests (includes the time-skipping Temporal tests and the NL search eval)
        run: pytest -q

  mls-sim:
    name: mls-sim (synthetic RESO Web API)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/mls-sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/mls-sim/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  web:
    name: web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  compose:
    name: compose stack, seed and smoke test
    runs-on: ubuntu-latest
    needs: [api, ai, mls-sim, web]
    steps:
      - uses: actions/checkout@v4
      - name: Bring the stack up
        run: docker compose up --build -d
      - name: Wait for the seed to finish
        run: |
          code=$(timeout 1200 docker compose wait seed)
          echo "seed exited with $code"
          docker compose logs --no-log-prefix seed | grep '\[seed\]'
          test "$code" = "0"
      - name: Smoke test the API, a live lead conversation and every dashboard page
        run: bash scripts/smoke.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200
