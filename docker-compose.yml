# The whole platform on one machine: docker compose up --build -d
# Host ports are overridable through .env (see .env.example).

x-api-env: &api-env
  DATABASE_URL_OWNER: postgresql://idx:idx@postgres:5432/idx
  DATABASE_URL_APP: postgresql://idx_app:${IDX_APP_PASSWORD:-idx_app}@postgres:5432/idx
  DATABASE_URL_PLATFORM: postgresql://idx_platform:${IDX_PLATFORM_PASSWORD:-idx_platform}@postgres:5432/idx
  IDX_APP_PASSWORD: ${IDX_APP_PASSWORD:-idx_app}
  IDX_PLATFORM_PASSWORD: ${IDX_PLATFORM_PASSWORD:-idx_platform}
  REDIS_URL: redis://redis:6379
  OPENSEARCH_URL: http://opensearch:9200
  KAFKA_BROKERS: redpanda:9092
  TEMPORAL_ADDRESS: temporal:7233
  AI_URL: http://ai:8000
  MLS_BASE_URL: http://mls-sim:8000
  MLS_CLIENT_SECRET: ${MLS_CLIENT_SECRET:-dev-mls-secret}
  INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
  JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
  AUTH_MODE: dev
  SMS_ADAPTER: sandbox
  SMS_AUTH_TOKEN: ${SMS_AUTH_TOKEN:-dev-sms-auth-token}
  PUBLIC_WEBHOOK_BASE: http://localhost:${API_PORT:-4100}
  REPLICATION_INTERVAL_MS: ${REPLICATION_INTERVAL_MS:-15000}
  RECONCILE_INTERVAL_MS: ${RECONCILE_INTERVAL_MS:-600000}

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: idx
      POSTGRES_PASSWORD: idx
      POSTGRES_DB: idx
    ports: ["${PG_PORT:-5442}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idx -d idx"]
      interval: 3s
      timeout: 3s
      retries: 40

  redis:
    image: redis:7-alpine
    ports: ["${REDIS_PORT:-6390}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms768m -Xmx768m
      bootstrap.memory_lock: "false"
    ports: ["${OPENSEARCH_PORT:-9210}:9200"]
    volumes: [osdata:/usr/share/opensearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 60

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:${KAFKA_PORT:-19093}
    ports: ["${KAFKA_PORT:-19093}:19092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 5s
      timeout: 5s
      retries: 40

  temporal:
    image: temporalio/temporal:1.9.1
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--ui-port", "8233", "--db-filename", "/home/temporal/temporal.db"]
    ports: ["${TEMPORAL_PORT:-7243}:7233", "${TEMPORAL_UI_PORT:-8243}:8233"]
    volumes: [temporaldata:/home/temporal]
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 40

  mls-sim:
    restart: unless-stopped
    build: { context: ., dockerfile: services/mls-sim/Dockerfile }
    environment:
      SIM_TICK_SECONDS: ${SIM_TICK_SECONDS:-20}
      MLS_CLIENT_SECRET: ${MLS_CLIENT_SECRET:-dev-mls-secret}
    ports: ["${MLS_PORT:-8110}:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 5s
      retries: 30

  ai:
    restart: unless-stopped
    build: { context: ., dockerfile: services/ai/Dockerfile }
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-offline}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
    ports: ["${AI_PORT:-8100}:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 5s
      retries: 30

  ai-worker:
    restart: unless-stopped
    build: { context: ., dockerfile: services/ai/Dockerfile }
    command: ["python", "-m", "app.worker"]
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-offline}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      TEMPORAL_ADDRESS: temporal:7233
      API_URL: http://api:4000
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
    depends_on:
      temporal: { condition: service_healthy }

  api:
    restart: unless-stopped
    build: { context: ., dockerfile: services/api/Dockerfile }
    environment:
      <<: *api-env
      WORKER_ROLES: none
    ports: ["${API_PORT:-4100}:4000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      redpanda: { condition: service_healthy }
      temporal: { condition: service_healthy }
      ai: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      retries: 40

  worker:
    restart: unless-stopped
    build: { context: ., dockerfile: services/api/Dockerfile }
    command: ["node", "dist/worker.js"]
    environment:
      <<: *api-env
      WORKER_ROLES: replicator,relay,indexer,engagement,scheduler
    depends_on:
      api: { condition: service_healthy }
      mls-sim: { condition: service_healthy }

  web:
    restart: unless-stopped
    build: { context: ., dockerfile: services/web/Dockerfile }
    environment:
      API_INTERNAL_URL: http://api:4000
      TEMPORAL_UI_URL: http://localhost:${TEMPORAL_UI_PORT:-8243}
    ports: ["${WEB_PORT:-3100}:3000"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      retries: 40

  seed:
    build: { context: ., dockerfile: tools/seed/Dockerfile }
    environment:
      API_URL: http://api:4000
      DATABASE_URL: postgresql://idx:idx@postgres:5432/idx
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
      SEED_LIVE_LEADS: ${SEED_LIVE_LEADS:-120}
    depends_on:
      api: { condition: service_healthy }
      worker: { condition: service_started }
      ai-worker: { condition: service_started }
    restart: "no"

volumes:
  pgdata:
  osdata:
  temporaldata:
